[project]
name = "verireq"
version = "0.2.0"
description = "VeriReq — Engineering Intelligence. Requirement verification workbench."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://copilot.intelligent-design.us"
Repository = "https://github.com/intelligent-design-llc/verireq"
Issues = "https://github.com/intelligent-design-llc/verireq/issues"
Changelog = "https://github.com/intelligent-design-llc/verireq/blob/main/CHANGELOG.md"

[project.scripts]
verireq = "verireq.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["verireq*"]
