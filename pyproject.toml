[project]
name = "verireq"
version = "0.2.0"
description = "VeriReq — Engineering Intelligence. Requirement verification workbench."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.34",
  "pypdf==7.1.1",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "httpx==0.28.1",
  "PyYAML==6.0.4",
  "defusedxml==0.7.1",
]

[project.urls]
Homepage = "https://copilot.intelligent-design.us"
Repository = "https://github.com/intelligent-design-llc/verireq"
Issues = "https://github.com/intelligent-design-llc/verireq/issues"
Changelog = "https://github.com/intelligent-design-llc/verireq/blob/main/CHANGELOG.md"

[project.scripts]
verireq = "verireq.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["verireq*"]
